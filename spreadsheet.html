<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Data Editor</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            color: #444;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: #fff;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        thead th {
            background-color: #007bff;
            color: white;
        }
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tbody tr:hover {
            background-color: #e9e9e9;
        }
        /* Styling for the toggle switch */
        .switch { 
            position: relative; 
            display: inline-block; 
            width: 50px; 
            height: 24px; 
        }
        .switch input { 
            opacity: 0; 
            width: 0; 
            height: 0; 
        }
        .slider { 
            position: absolute; 
            cursor: pointer; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0; 
            background-color: #ccc; 
            transition: .4s; 
            border-radius: 24px; 
        }
        .slider:before { 
            position: absolute; 
            content: ""; 
            height: 18px; 
            width: 18px; 
            left: 3px; 
            bottom: 3px; 
            background-color: white; 
            transition: .4s; 
            border-radius: 50%; 
        }
        input:checked + .slider { 
            background-color: #28a745; 
        }
        input:checked + .slider:before { 
            transform: translateX(26px); 
        }
    </style>
</head>
<body>

    <h1>Spreadsheet Data</h1>
    <table id="data-table">
        <thead></thead>
        <tbody></tbody>
    </table>

    <script>
        //
        // --- SCRIPT CONFIGURATION ---
        //
        // IMPORTANT: Replace this URL with the one from your deployed Google Apps Script
        const webAppUrl = 'https://script.google.com/macros/s/AKfycby8kSPt5WXUa0qb_rhm8517Xb2gFHcmxUprTVGp5wKSQXq9kT8zD2_NQIL9IF6k8DKJAA/exec';
        
        // The index for the 'status' column (0-based: A=0, B=1, C=2, etc.)
        const statusColumnIndex = 2; 

        /**
         * Fetches all data from the Google Sheet and builds the HTML table.
         */
        function loadTable() {
            fetch(webAppUrl)
                .then(response => response.json())
                .then(data => {
                    const table = document.getElementById('data-table');
                    const thead = table.querySelector('thead');
                    const tbody = table.querySelector('tbody');

                    // Clear any existing table content
                    thead.innerHTML = '';
                    tbody.innerHTML = '';

                    // Create table headers from the first row of data
                    const headerRow = document.createElement('tr');
                    data[0].forEach(headerText => {
                        const th = document.createElement('th');
                        th.textContent = headerText;
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);

                    // Create table body rows (skipping the header row in the data array)
                    data.slice(1).forEach((rowData, rowIndex) => {
                        const tr = document.createElement('tr');
                        // Store the actual sheet row number. It's rowIndex + 2 because:
                        // - rowIndex is 0-based
                        // - We sliced off the header row
                        tr.dataset.row = rowIndex + 2; 

                        rowData.forEach((cellData, cellIndex) => {
                            const td = document.createElement('td');
                            if (cellIndex === statusColumnIndex) {
                                // For the status column, create a toggle switch
                                td.innerHTML = `
                                    <label class="switch">
                                        <input type="checkbox" ${cellData == 1 ? 'checked' : ''} onclick="updateStatus(this)">
                                        <span class="slider"></span>
                                    </label>
                                `;
                            } else {
                                // For all other columns, just display the text
                                td.textContent = cellData;
                            }
                            tr.appendChild(td);
                        });
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error('Error loading sheet data:', error);
                    document.getElementById('data-table').querySelector('tbody').innerHTML = 
                        '<tr><td colspan="100%">Failed to load data. Check the Web App URL and sheet permissions.</td></tr>';
                });
        }

        /**
         * Sends an update request to the Google Apps Script when a toggle is clicked.
         * @param {HTMLInputElement} checkbox The checkbox element that was clicked.
         */
        function updateStatus(checkbox) {
            const tr = checkbox.closest('tr');
            const rowNumber = tr.dataset.row;
            const newStatus = checkbox.checked ? 1 : 0;

            console.log(`Updating row ${rowNumber} to status ${newStatus}`);

            // Send the data using a POST request
            fetch(webAppUrl, {
                method: 'POST',
                // The header is important for the Apps Script to know it's receiving JSON
                headers: {
					'Content-Type': 'text/plain;charset=utf-8', 
                },
                // The body contains the data for the doPost(e) function
                body: JSON.stringify({ row: rowNumber, status: newStatus }),
            })
            .then(response => response.json())
            .then(result => {
                console.log('Update successful:', result);
            })
            .catch(error => console.error('Error updating status:', error));
        }

        // Add an event listener to run the loadTable function once the HTML document has loaded
        document.addEventListener('DOMContentLoaded', loadTable);
    </script>
</body>
</html>
