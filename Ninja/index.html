<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">Ottodiy Ninja</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Link to the Web App Manifest -->
    <link rel="manifest" href="manifest.json">
    <!-- Favicon link -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <header class="page-header">
        <h1 data-i18n="headerTitle">Ninja Control</h1>
        <div class="header-controls">
            <div class="connectivity-switch-panel">
                <button id="connectivityToggleBtn" aria-label="Select Connectivity" data-i18n="connectivityToggleBtn" title="Change Connectivity">
                    <img src="bars.svg" alt="Connectivity Icon" class="header-icon">
                </button>
                <div id="connectivityDropdown" class="connectivity-dropdown">
                    <button data-conn="net" data-i18n="net">
                        <img src="wifi.svg" alt="Wi-Fi Icon" class="conn-icon">
                        <span data-i18n-text="net">NET</span>
                    </button>
                    <button data-conn="ble" data-i18n="ble">
					    <img src="bluetooth.svg" alt="Bluetooth Icon" class="conn-icon">
                        <span data-i18n-text="ble">BLE</span>
                    </button>
                    <button data-conn="ser" data-i18n="ser">
						<img src="usb.svg" alt="Serial Icon" class="conn-icon">
                        <span data-i18n-text="ser">SER</span>
                    </button>
                </div>
            </div>
            <div class="language-switch-panel">
                <button id="languageToggleBtn" aria-label="Select Language" data-i18n="languageToggleBtn" title="Change language">
                    <img src="globe.svg" alt="Language Icon" class="header-icon">
                </button>
                <div id="languageDropdown" class="language-dropdown">
                    <!-- Removed data-i18n from these buttons as their text will be set dynamically in script.js -->
                    <button data-lang="en">English</button>
                    <button data-lang="es">Español</button>
                    <button data-lang="fr">Français</button>
                    <button data-lang="de">Deutsch</button>
                    <button data-lang="it">Italiano</button>
                    <button data-lang="nl">Nederlands</button>
                    <button data-lang="ja">日本語</button>
                    <button data-lang="zh">中文</button>
                    <button data-lang="sv">Svenska</button>
                    <button data-lang="pt">Português</button>
                    <button data-lang="ru">Русский</button>
                    <button data-lang="pl">Polski</button>
                </div>
            </div>
            <div class="theme-switch-panel">
                <button id="themeToggleBtn" aria-label="Toggle Theme" data-i18n="themeToggleBtn" title="Switch to Light Mode">
                    <img src="sun.svg" alt="Theme Icon" class="header-icon" data-icon-type="theme">
                </button>
            </div>
        </div>
    </header>

    <div class="control-panel-container">
        <div id="buttonPanel" class="button-panel">
            <button id="upBtn" class="up-arrow" aria-label="Up Arrow" data-i18n="upBtnTitle">&#9650;</button>
            <button id="leftBtn" class="left-arrow" aria-label="Left Arrow" data-i18n="leftBtnTitle">&#9664;</button>
            <button id="centerBtn" class="center-square" aria-label="Center Square" data-i18n="centerBtnTitle">&#9724;</button>
            <button id="rightBtn" class="right-arrow" aria-label="Right Arrow" data-i18n="rightBtnTitle">&#9654;</button>
            <button id="downBtn" class="down-arrow" aria-label="Down Arrow" data-i18n="downBtnTitle">&#9660;</button>
        </div>

        <div id="joystickPanel" class="joystick-panel">
            <div id="joystickBase" class="joystick-base">
                <div id="joystickHandle" class="joystick-handle"></div>
            </div>
        </div>
    </div>

    <div class="mode-switch-panel">
        <button id="walkModeBtn" class="active-mode" data-i18n="walkModeBtn">Walk</button>
        <button id="rollModeBtn" data-i18n="rollModeBtn">Roll</button>
    </div>

    <div class="action-button-panel">
        <button id="avoidBtn" data-i18n="avoidBtn">Avoid</button>
        <button id="followBtn" data-i18n="followBtn">Follow</button>
    </div>

    <!-- Tone.js library for sound effects -->
    <script src="Tone.min.js"></script>
    <!-- Link to your external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
